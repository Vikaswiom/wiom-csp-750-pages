<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>₹750 — bell icon</title>
<!-- Named entry point for the bell icon in the app. It is NOT a copy of the offer page:
     it forwards to flow1.html tagged src=bell, so there is one page to maintain
     and every event from here is attributed to this surface.
        bell.html?cspId=<CSP_ID>   ->   flow1.html?cspId=<CSP_ID>&src=bell -->
<script>
(function(){
  var q = String(location.search || '') + String(location.hash || '');
  var m = /[?&#]csp[_-]?id=([^&#]+)/i.exec(q);
  var id = m ? decodeURIComponent(m[1]) : '';
  var url = 'flow1.html?src=bell' + (id ? '&cspId=' + encodeURIComponent(id) : '');
  location.replace(url);          /* replace, so Back does not bounce through here */
})();
</script>
<noscript><a href="flow1.html?src=bell">Continue</a></noscript>
