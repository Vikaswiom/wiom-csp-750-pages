<!-- ================================================================
     CSP ₹750 PAYOUT — SAWAAL-JAWAAB (FAQ)
     Companion to flow1.html (the opt-in page). Same visual family:
     brand-sec appbar, 420px phone frame, brand-600 accents.

     Content model lives in the FAQ constant at the bottom of the file:
     every question carries hi/en strings and a status. Questions with
     status 'pending' are HIDDEN from CSPs and shown only in review
     mode (?review=1) with the open question that still needs a ruling.
================================================================ -->
<title>CSP ₹750 सवाल-जवाब</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    color-scheme: light;   /* the page commits to the app's light world */
    --brand-600:#D9008D;
    --brand-300:#FFB2E4;
    --brand-200:#FFCCED;
    --brand-100:#FFE5F6;
    --brand-sec:#443152;
    --n900:#161021;
    --n800:#352D42;
    --n700:#665E75;
    --n500:#A7A1B2;
    --n300:#D7D3E0;
    --n200:#E8E4F0;
    --n100:#F4F2F8;
    --white:#FFFFFF;
    --positive:#1B7F4B;
    --positive-bg:#E4F5EC;
    --caution:#806000;
    --caution-bg:#FFF2BF;
    --page-bg:#FFFFFF;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--page-bg);
    font-family:"Noto Sans Devanagari","Noto Sans",-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Devanagari MT", sans-serif;
    color:var(--n900);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    max-width:420px; margin:0 auto;
    background:var(--white); min-height:100vh;
    box-shadow:0 0 40px rgba(22,16,33,.18);
    position:relative;
  }
  @media (min-width:480px){
    body{ background:var(--n200); }
    .phone{ margin:24px auto 40px; border-radius:24px; overflow:hidden; min-height:0; }
  }

  /* ── App bar ─────────────────────────────────────────── */
  .appbar{
    background:var(--brand-sec); color:var(--white);
    padding:14px 16px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:20;
  }
  .appbar .back{ font-size:20px; line-height:1; opacity:.9; text-decoration:none; color:inherit; }
  .appbar .title{ font-size:16px; font-weight:700; }
  .langtoggle{
    margin-left:auto;
    border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.08);
    color:var(--white); border-radius:999px;
    font-family:inherit; font-size:13px; font-weight:700;
    padding:6px 14px; cursor:pointer;
  }
  .langtoggle:focus-visible{ outline:2px solid var(--brand-300); outline-offset:2px; }

  .content{ padding:0 20px 28px; }

  /* ── Intro ───────────────────────────────────────────── */
  .intro{ padding:24px 0 4px; }
  .intro h1{ font-size:22px; line-height:30px; font-weight:700; margin:0 0 6px; text-wrap:balance; }
  .intro p{ font-size:15px; line-height:22px; color:var(--n700); margin:0; }

  /* ── Recap card: the offer in three rows ─────────────── */
  .recap{
    margin:20px 0 0; border:1px solid var(--brand-200); background:var(--brand-100);
    border-radius:16px; padding:16px;
  }
  .recap h2{
    font-size:12px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    color:var(--brand-600); margin:0 0 12px;
  }
  .rrow{ display:flex; gap:12px; align-items:flex-start; }
  .rrow + .rrow{ margin-top:12px; padding-top:12px; border-top:1px solid var(--brand-200); }
  .rnum{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background:var(--brand-600); color:var(--white);
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .rtext{ flex:1; }
  .rtext .rt{ margin:0; font-size:15px; line-height:21px; font-weight:700; }
  .rtext .rs{ margin:2px 0 0; font-size:13px; line-height:19px; color:var(--n800); }
  .rtext b{ color:var(--brand-600); }


  /* ── Most-asked strip ────────────────────────────────── */
  .blockh{
    font-size:12px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    color:var(--n700); margin:0 0 12px;
  }

  /* ── Category sections ───────────────────────────────── */
  .cat{ margin:32px 0 0; scroll-margin-top:64px; }
  .cathead{ display:flex; gap:12px; align-items:center; margin:0 0 14px; }
  .icircle{
    width:40px; height:40px; border-radius:50%;
    background:var(--brand-100); color:var(--brand-600);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icircle svg{ display:block; }
  .cathead h2{ font-size:17px; line-height:24px; font-weight:700; margin:0; }
  .cathead p{ font-size:13px; line-height:18px; color:var(--n700); margin:2px 0 0; }

  .qlist{ display:flex; flex-direction:column; gap:8px; }
  .qitem{
    border:1px solid var(--n200); border-radius:12px; overflow:hidden;
    background:var(--white); scroll-margin-top:64px;
  }
  .qitem.open{ border-color:var(--brand-200); }
  .qbtn{
    width:100%; text-align:left; font-family:inherit; cursor:pointer;
    border:0; background:transparent;
    padding:14px 14px; display:flex; gap:10px; align-items:flex-start;
    font-size:15px; line-height:21px; font-weight:700; color:var(--n900);
  }
  .qbtn:focus-visible{ outline:3px solid var(--brand-300); outline-offset:-3px; }
  .qbtn .qtext{ flex:1; }
  .chev{
    flex-shrink:0; color:var(--n500); margin-top:2px;
    transition:transform .18s ease;
  }
  .qitem.open .chev{ transform:rotate(180deg); color:var(--brand-600); }
  .qans{
    display:none; padding:0 14px 16px; margin-top:-2px;
  }
  .qitem.open .qans{ display:block; }
  .qans p{ margin:0; font-size:14px; line-height:21px; color:var(--n800); }
  .qans p + p{ margin-top:8px; }
  .qans b{ font-weight:700; color:var(--brand-600); }
  .qans .plain b{ color:inherit; }

  /* the CSP's own words, quoted back above the answer */
  .said{
    margin:0 0 10px; padding:10px 12px;
    background:var(--n100); border-radius:10px;
    border-left:3px solid var(--n300);
    font-size:13px; line-height:19px; color:var(--n700); font-style:normal;
  }

  /* a small money table inside an answer */
  .mini{ margin:10px 0 0; border:1px solid var(--n200); border-radius:10px; overflow:hidden; }
  .mini div{ display:flex; align-items:center; gap:10px; padding:10px 12px; font-size:13px; line-height:19px; }
  .mini div + div{ border-top:1px solid var(--n200); }
  .mini .lab{ flex:1; color:var(--n800); }
  .mini .val{ font-weight:700; color:var(--n900); font-variant-numeric:tabular-nums; flex-shrink:0; }
  .mini .val.pink{ color:var(--brand-600); }
  .mini .tot{ background:var(--n100); }

  /* callout inside an answer */
  .note{
    margin:10px 0 0; padding:11px 12px; border-radius:10px;
    background:var(--brand-100); border:1px solid var(--brand-200);
    font-size:13px; line-height:19px; color:var(--n800);
  }
  .note.calm{ background:var(--n100); border-color:var(--n200); }

  /* ── Pending (review-mode only) ──────────────────────── */
  .qitem.pending{ display:none; }
  .review .qitem.pending{ display:block; border-color:#E8D48A; background:#FFFDF4; }
  .review .qitem.pending .qbtn{ color:var(--caution); }
  .pendbadge{
    display:inline-block; margin:0 0 8px;
    background:var(--caution-bg); color:var(--caution);
    font-size:11px; font-weight:700; letter-spacing:.4px;
    border-radius:4px; padding:3px 8px;
  }
  .askline{
    margin:8px 0 0; padding:10px 12px; border-radius:10px;
    background:var(--white); border:1px dashed #E8D48A;
    font-size:13px; line-height:19px; color:var(--n800);
  }
  .askline b{ color:var(--caution); }
  .reviewbar{
    display:none; background:var(--caution-bg); color:var(--caution);
    padding:10px 20px; font-size:13px; line-height:19px; font-weight:700;
  }
  .review .reviewbar{ display:block; }

  /* ── Inline CTA inside answer ────────────────────────── */
  .ans-cta{
    display:block; width:100%; border:0; border-radius:12px;
    padding:14px 16px; margin:12px 0 0;
    background:var(--brand-600); color:var(--white);
    font-family:inherit; font-size:15px; font-weight:700;
    text-align:center; text-decoration:none; cursor:pointer;
  }
  .ans-cta:active{ opacity:.9; }
  .calldone{
    margin:14px 0 0; padding:10px 12px; border-radius:10px;
    background:var(--positive-bg, #E4F5EC); color:#1B7F4B;
    font-size:14px; font-weight:700; line-height:20px;
  }
  .ans-cta:focus-visible{ outline:3px solid var(--brand-300); outline-offset:2px; }

  /* ── Talk to us ──────────────────────────────────────── */
  .helpcard{
    margin:32px 0 0; border:1px solid var(--n200); border-radius:16px;
    padding:18px 16px; text-align:center;
  }
  .helpcard .icircle{ margin:0 auto 10px; width:48px; height:48px; }
  .helpcard h2{ font-size:16px; line-height:23px; font-weight:700; margin:0 0 4px; }
  .helpcard p{ font-size:14px; line-height:20px; color:var(--n700); margin:0 0 14px; max-width:30ch; margin-left:auto; margin-right:auto; }
  .linkcta{
    display:inline-block; border:0; background:transparent;
    font-family:inherit; font-size:16px; font-weight:700; line-height:24px;
    color:var(--brand-600); padding:12px 16px; cursor:pointer;
    text-decoration:none;
  }
  .linkcta:focus-visible{ outline:3px solid var(--brand-300); outline-offset:2px; border-radius:8px; }

  /* ── Sticky CTA ──────────────────────────────────────── */
  .ctabar{
    position:sticky; bottom:0; z-index:15;
    background:var(--white); border-top:1px solid var(--n200);
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(22,16,33,.08);
  }
  .cta{
    display:block; width:100%; border:0; border-radius:14px;
    padding:16px; font-size:16px; font-weight:700; font-family:inherit;
    background:var(--brand-600); color:var(--white); cursor:pointer;
    text-align:center; text-decoration:none;
  }
  .cta:active{ transform:scale(.99); }
  .cta:focus-visible{ outline:3px solid var(--brand-300); outline-offset:2px; }

  .footnote{
    padding:18px 20px 4px; font-size:12px; line-height:18px;
    color:var(--n500); text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>

    q:{hi:'₹750 में से कुछ कटेगा तो नहीं?', en:'Will anything be deducted from the ₹750?'},
    ask:'Does the full ₹750 reach the CSP, or is anything adjusted first (TDS, pending dues, carry fee)? Only ship this question if the answer is "पूरा ₹750 मिलेगा" — an unanswered deduction question in our own voice would plant a fear no CSP raised.'},

  { id:'service-complaint-750-withheld', status:'pending', src:[],
    q:{hi:'सर्विस की शिकायत आई तो ₹750 रुक जाएगा?', en:'If a service complaint comes, is the ₹750 held?'},
    ask:'Can the ₹750 be held or reversed for any reason at all — service complaints, audit failure, suspected mis-selling? If it truly cannot, that is a strong trust line worth printing.'},

  { id:'bonus-120-fix-first', status:'pending', src:[],
    q:{hi:'मेरा ₹120 का बोनस पहले ठीक कराओ', en:'Fix my ₹120 bonus first'},
    said:{hi:'₹120 का बोनस फिक्स कर दो, तो मैं ₹750 वाला प्लान लेने को तैयार हूँ',
          en:'Fix the ₹120 bonus and I am ready to take the ₹750 plan'},
    ask:'13 CSPs are holding the ₹750 hostage to the bonus. An FAQ cannot resolve a per-CSP account grievance — but staying silent reads as dodging. What is the honest line: is the bonus a separate program, is there a route to raise it, and does raising it block or delay the ₹750?'},

  { id:'carry-fee-status', status:'pending', src:[],
    q:{hi:'कैरी फ़ीस वाली बात का क्या हुआ?', en:'What happened about the carry fee?'},
    ask:'Same as the bonus: what is the honest one-line acknowledgement, and where does a CSP take it? Roughly 120 CSPs spent their entire call on carry fee, bad leads and unpaid bonus and never reached the offer at all.'},

  { id:'no-leads-what-use', status:'pending', src:[],
    q:{hi:'लीड ही नहीं आ रही — ऑफ़र लेकर क्या करूँ?', en:'No leads are coming — what use is the offer?'},
    ask:'For the 14 CSPs getting no leads: can we say plainly that opting in costs nothing until a connection is actually installed? That depends on your reversibility ruling — if opting in is irreversible, that line cannot be printed.'}
  ]
}

]};
</script>
<script>
(function(){
  'use strict';

  /* ── CSP ID rides through from the app link, and on to the offer page ── */
  var params = new URLSearchParams(location.search);
  var CSPID  = params.get('cspId') || params.get('cspid') || '';
  var REVIEW = params.has('review') || /(^|[#&])review\b/.test(location.hash);
  if (REVIEW) document.documentElement.classList.add('review');

  var OFFER = 'https://vikaswiom.github.io/wiom-csp-750-pages/flow1.html'
            + (CSPID ? '?cspId=' + encodeURIComponent(CSPID) : '');

  var lang = (params.get('lang') === 'en') ? 'en' : 'hi';
  var opened = {};          /* question id -> 1, for the dwell snapshot */
  var openOrder = [];

  /* ══════════════ Analytics (CleverTap, same shim as the offer page) ══════════════
     FAQ750_Viewed          page opened
     FAQ750_Searched        {q}         first three characters of a search
     FAQ750_QuestionOpened  {id, cat, rank}
     FAQ750_CtaClicked      {target:'offer'|'call'}
     FAQ750_Closed          terminal — carries which questions were opened, in order,
                            how many, the language, and seconds on page. This is the
                            number that tells us which doubt actually dominates.
  ═══════════════════════════════════════════════════════════════════════════════ */
  var EV = 'FAQ750_', t0 = Date.now(), sent = {}, ended = false;
  var DEBUG = (location.protocol === 'file:');
  function ctPush(ev, props){
    try{ if (window.CleverTap && typeof window.CleverTap.pushEvent === 'function'){
      props ? window.CleverTap.pushEvent(ev, JSON.stringify(props)) : window.CleverTap.pushEvent(ev); return true; } }catch(e){}
    try{ var wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap;
      if (wk){ wk.postMessage({ action:'recordEventWithProps', event:ev, properties:props||{} }); return true; } }catch(e){}
    return false;
  }
  function track(name, props){
    props = props || {};
    if (CSPID) props.csp_id = CSPID;
    var ev = EV + name, key = ev + '|' + JSON.stringify(props);
    if (sent[key]) return; sent[key] = 1;
    if (DEBUG){ try{ console.log('[track]', ev, props); }catch(e){} }
    var n = 0; (function go(){ n++; if (ctPush(ev, props)) return; if (n < 6) setTimeout(go, 250 * n); })();
  }
  function close(exit){
    if (ended) return; ended = true;
    track('Closed', {
      opened_count: openOrder.length,
      opened_ids: openOrder.join(','),
      first_opened: openOrder[0] || '',
      lang: lang,
      seconds: Math.round((Date.now() - t0) / 1000),
      exit: exit
    });
  }
  window.addEventListener('pagehide', function(){ close('pagehide'); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') close('hidden');
  });

  /* ── Tiny helpers ── */
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function t(obj){ return (obj && obj[lang] != null) ? obj[lang] : (obj && obj.hi) || ''; }

  var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ── Flatten the question index once ── */
  var INDEX = {};
  FAQ.categories.forEach(function(cat){
    cat.questions.forEach(function(q){ INDEX[q.id] = { q: q, cat: cat }; });
  });

  /* ══════════════ Render ══════════════ */
  var root = document.getElementById('cats');

  function renderAnswer(q){
    var wrap = el('div', 'qans');
    if (q.said) {
      wrap.appendChild(el('p', 'said', '&ldquo;' + t(q.said) + '&rdquo;'));
    }
    if (q.status === 'pending') {
      wrap.appendChild(el('span', 'pendbadge', lang === 'hi' ? 'जवाब आना बाकी' : 'ANSWER PENDING'));
      wrap.appendChild(el('p', '', lang === 'hi'
        ? 'यह सवाल पेज पर तभी दिखेगा जब जवाब तय हो जाएगा।'
        : 'This question appears to CSPs only once the answer is settled.'));
      wrap.appendChild(el('div', 'askline', '<b>' + (lang === 'hi' ? 'तय करना है: ' : 'Needs a ruling: ') + '</b>' + q.ask));
    } else {
      (q.a || []).forEach(function(block){
        if (typeof block === 'object' && block.type === 'mini') {
          var m = el('div', 'mini');
          block.rows.forEach(function(r){
            var row = el('div', r.total ? 'tot' : '');
            row.appendChild(el('span', 'lab', t(r.label)));
            row.appendChild(el('span', 'val' + (r.pink ? ' pink' : ''), t(r.value)));
            m.appendChild(row);
          });
          wrap.appendChild(m);
        } else if (typeof block === 'object' && block.type === 'note') {
          wrap.appendChild(el('div', 'note' + (block.calm ? ' calm' : ''), t(block)));
        } else if (typeof block === 'object' && block.type === 'cta') {
          var ctaLink = el('a', 'ans-cta', t(block));
          ctaLink.href = '#';
          ctaLink.addEventListener('click', function(e){
            e.preventDefault();
            requestCall('answer_cta', ctaLink);
          });
          wrap.appendChild(ctaLink);
        } else {
          wrap.appendChild(el('p', '', t(block)));
        }
      });
    }
    return wrap;
  }

  function renderQuestion(q, cat, rank){
    var item = el('div', 'qitem' + (q.status === 'pending' ? ' pending' : ''));
    item.id = 'q-' + q.id;
    item.dataset.qid = q.id;

    var btn = el('button', 'qbtn');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<span class="qtext">' + t(q.q) + '</span>' + CHEV;
    btn.addEventListener('click', function(){ toggle(item, cat, q, rank); });

    item.appendChild(btn);
    item.appendChild(renderAnswer(q));
    return item;
  }

  function toggle(item, cat, q, rank, forceOpen){
    var isOpen = item.classList.contains('open');
    if (isOpen && forceOpen) return;
    /* One answer open at a time: opening a question closes whichever was open.
       Without this the page grew into a wall of text as the CSP explored. */
    if (!isOpen) {
      var others = document.querySelectorAll('.qitem.open');
      for (var i = 0; i < others.length; i++) {
        if (others[i] === item) continue;
        others[i].classList.remove('open');
        var ob = others[i].querySelector('.qbtn');
        if (ob) ob.setAttribute('aria-expanded', 'false');
      }
    }
    item.classList.toggle('open', forceOpen ? true : !isOpen);
    var btn = item.querySelector('.qbtn');
    btn.setAttribute('aria-expanded', item.classList.contains('open') ? 'true' : 'false');
    if (item.classList.contains('open') && !opened[q.id]) {
      opened[q.id] = 1; openOrder.push(q.id);
      track('QuestionOpened', { id: q.id, cat: cat.id, rank: rank });
    }
  }

  function visibleCount(cat){
    return cat.questions.filter(function(q){ return REVIEW || q.status !== 'pending'; }).length;
  }

  function render(){
    root.innerHTML = '';
    FAQ.categories.forEach(function(cat){
      /* A category whose every answer is still pending would render as a
         header over nothing. Hide it until at least one answer lands. */
      if (!visibleCount(cat)) return;
      var sec = el('section', 'cat');
      sec.id = 'cat-' + cat.id;

      var head = el('div', 'cathead');
      head.appendChild(el('div', 'icircle', cat.icon));
      var ht = el('div');
      ht.appendChild(el('h2', '', t(cat.title)));
      ht.appendChild(el('p', '', t(cat.sub)));
      head.appendChild(ht);
      sec.appendChild(head);

      var list = el('div', 'qlist');
      cat.questions.forEach(function(q, i){ list.appendChild(renderQuestion(q, cat, i + 1)); });
      sec.appendChild(list);
      root.appendChild(sec);
    });
    paintStatic();
  }

  /* ── Static strings that live in the markup ── */
  function paintStatic(){
    document.querySelectorAll('[data-s]').forEach(function(n){
      var v = S[lang][n.dataset.s];
      if (v != null) n.innerHTML = v;
    });
    document.querySelectorAll('[data-sp]').forEach(function(n){
      var v = S[lang][n.dataset.sp];
      if (v != null) n.setAttribute('placeholder', v);
    });
    document.title = S[lang].docTitle;
    document.documentElement.lang = (lang === 'hi' ? 'hi' : 'en');
    paintCtas();
    if (REVIEW) {
      var pend = 0, live = 0;
      FAQ.categories.forEach(function(c){
        c.questions.forEach(function(q){ q.status === 'pending' ? pend++ : live++; });
      });
      document.querySelector('.reviewbar').innerHTML =
        S[lang].reviewBar + ' &nbsp;·&nbsp; ' + live + ' ' + S[lang].reviewLive
        + ', ' + pend + ' ' + S[lang].reviewPend;
    }
  }

  /* ── Language toggle ── */
  document.getElementById('langToggle').addEventListener('click', function(){
    /* Re-open only what is open RIGHT NOW (openOrder is the full history, and
       replaying it would reopen every question the CSP ever expanded). */
    var openIds = [];
    var cur = document.querySelectorAll('.qitem.open');
    for (var i = 0; i < cur.length; i++) {
      if (cur[i].id.indexOf('q-') === 0) openIds.push(cur[i].id.slice(2));
    }
    lang = (lang === 'hi' ? 'en' : 'hi');
    render();
    openIds.forEach(function(id){
      var item = document.getElementById('q-' + id);
      if (!item) return;
      item.classList.add('open');
      var b = item.querySelector('.qbtn');
      if (b) b.setAttribute('aria-expanded', 'true');
    });
  });

  /* ── CTAs ──
     The offer page refuses to open without a CSP ID. Forwarded on WhatsApp
     this page loses it, so a reader with no cspId is sent to the app rather
     than into that guard screen. */
  var offerBtn = document.getElementById('offerCta');
  var callBtn  = document.getElementById('callCta');

  function paintCtas(){
    if (CSPID) {
      offerBtn.setAttribute('href', OFFER);
      offerBtn.innerHTML = S[lang].offerCta;
      callBtn.innerHTML  = S[lang].helpCta;
    } else {
      offerBtn.removeAttribute('href');
      offerBtn.setAttribute('role', 'button');
      offerBtn.innerHTML = S[lang].offerCtaNoId;
      callBtn.innerHTML  = S[lang].helpCtaNoId;
    }
  }
  offerBtn.addEventListener('click', function(){
    track('CtaClicked', { target: CSPID ? 'offer' : 'no_cspid' });
  });
  callBtn.addEventListener('click', function(e){
    e.preventDefault();
    requestCall('help_card', callBtn);
  });

  /* ── Call request ──
     Tapping any "मुझे कॉल करके समझायें" used to bounce the CSP back to the offer
     page, which read as the tap having failed. It now logs the request to the
     team's sheet and confirms in place, so he knows a call is coming. */
  var callRequested = false;
  function requestCall(source, node){
    var id = CSPID || 'unknown';
    if (!callRequested) {
      callRequested = true;
      try {
        new Image().src = 'https://script.google.com/macros/s/AKfycbw770KNFn3SnpKbRwtLbPe8MJu8dpDXwau6UY-JTfcbA8Y0T2ZRyoGRRMhi4k8WTAo2/exec'
          + '?flow=P750CALL&screen=' + encodeURIComponent('faq_' + lang)
          + '&uid=' + encodeURIComponent(id) + '&t=' + (+new Date());
      } catch (err) {}
    }
    track('CtaClicked', { target: CSPID ? 'call' : 'call_no_cspid', source: source });
    if (node && node.parentNode) {
      var done = el('p', 'calldone', '\u2713 ' + S[lang].callDone);
      node.parentNode.replaceChild(done, node);
    }
    /* every other call CTA on the page switches to the same confirmation */
    var rest = document.querySelectorAll('.ans-cta, #callCta');
    for (var i = 0; i < rest.length; i++) {
      var d = el('p', 'calldone', '\u2713 ' + S[lang].callDone);
      if (rest[i].parentNode) rest[i].parentNode.replaceChild(d, rest[i]);
    }
  }

  /* ── Boot ── */
  render();
  track('Viewed', {});

  /* Deep link: #q-<id> opens that one answer — a tele-caller can send a
     single question over WhatsApp and it lands open. */
  if (location.hash.indexOf('#q-') === 0 && !REVIEW) {
    var id = location.hash.slice(3);
    setTimeout(function(){
      var item = document.getElementById('q-' + id);
      if (!item) return;
      var hit = INDEX[id];
      toggle(item, hit.cat, hit.q, 0, true);
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);
  }
})();

  /* ── Back ──
     Reached from the flow page's "जरूरी सवालों के जवाब" button, so history
     takes the CSP back where they were. Opened cold (WhatsApp forward), fall
     back to the offer page — or stay put if there is no CSP ID to carry. */
  (function(){
    var b = document.getElementById('backBtn');
    if (!b) return;
    b.addEventListener('click', function(e){
      e.preventDefault();
      if (history.length > 1) { history.back(); return; }
      if (CSPID) { location.href = OFFER; }
    });
  })();
</script>
